<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invite | Automated Routine Creator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <main class="auth-layout">
        <section class="auth-card glass invite-accept-card">
            <span class="badge">Workspace Invite</span>
            <h1>Accepting your invitation</h1>
            <p id="inviteAcceptMessage" class="form-message">Please wait while we add this email to the workspace.</p>
            <div class="form-actions invite-accept-actions" hidden>
                <a id="inviteRegisterLink" class="primary-button" href="register.html?from=home">Register</a>
                <a id="inviteLoginLink" class="secondary-button" href="login.html?from=home">Login</a>
            </div>
        </section>
    </main>
    <script src="js/accept_invite.js"></script>
</body>
</html>
